services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: norskkurs-backend-dev

  frontend:
    image: node:22.12.0-alpine
    user: "1000:1000"
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/
    ports: !override
      - "127.0.0.1:5173:5173"

volumes:
  frontend_node_modules:

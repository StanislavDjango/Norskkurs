name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend check
        run: python backend/manage.py check

      - name: Backend tests
        run: python backend/manage.py test exams

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate frontend API schema
        run: bash scripts/generate_frontend_api_schema.sh

      - name: Check committed API schema
        run: git diff --exit-code -- frontend/src/api-schema.d.ts

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend tests
        run: npm run test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

name: Feature request
description: Предложить улучшение продукта или процесса
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Что хочется получить
      description: Опишите желаемый результат
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Зачем это нужно
      description: Какую проблему это решает
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Дополнительный контекст
      description: Скриншоты, ссылки, идеи реализации
